<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Perses Admin</title>
<link rel="icon" href="https://i.ibb.co/0V6cpgY3/AI-logo-no-bg.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff5a00;--a2:#ff9a3c;--ok:#30a46c;--bad:#e5484d;--warn:#d4a73a}
[data-theme=dark]{--bg:#0e0e10;--panel:#17171a;--p2:#1f1f23;--line:#2a2a2f;--text:#ececec;--dim:#8d8d96;--grid:#26262b}
[data-theme=light]{--bg:#f6f3ee;--panel:#fff;--p2:#f3eee5;--line:#e4ddd0;--text:#1d1a16;--dim:#756e63;--grid:#eee6d9}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
input,select,textarea{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{width:100%;resize:vertical}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
h3{font-size:15px;margin-bottom:10px}
small{color:var(--dim)}
#gate{padding:80px 20px;text-align:center;color:var(--dim)}
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
#nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-weight:700;font-size:19px;margin-bottom:6px}
.brand img{width:30px;height:30px;border-radius:50%}
.role{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.ng{font-size:10.5px;letter-spacing:.14em;color:var(--dim);margin:14px 8px 4px}
#nav .t{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;color:var(--dim);transition:.15s}
#nav .t:hover{background:var(--p2);color:var(--text)}#nav .t.on{background:linear-gradient(135deg,var(--accent),var(--a2));color:#fff}
.foot{margin-top:16px;display:flex;flex-direction:column;gap:6px}
main{padding:18px;min-width:0}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.top h2{font-family:'Playfair Display',serif;font-size:22px;margin-right:auto}
.btn{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);transition:.15s}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn.sm{padding:3px 9px;font-size:12px}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.chip.pro{border-color:var(--accent);color:var(--accent)}.chip.elite{border-color:var(--warn);color:var(--warn)}.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.bad{border-color:var(--bad);color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;animation:in .3s ease;min-width:0}
.cards .card{margin:0}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.card small{display:block}.card b{font-size:25px;font-family:'Playfair Display',serif}.card em{font-style:normal;font-size:12px;margin-left:6px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}.grid2 .card{margin:0}
.cv{height:230px;position:relative}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
tr.rw{cursor:pointer}tr.rw:hover td{background:var(--p2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row.end{justify-content:flex-end}
.subs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow:auto}
.subs button{padding:6px 14px;border-radius:9px;color:var(--dim)}.subs button.on{background:var(--p2);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset}
.empty{padding:30px;text-align:center;color:var(--dim)}
.ticker{max-height:230px;overflow:auto}
.tk{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tk span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;width:60px;color:var(--accent)}.tk.busy span{color:var(--bad)}.tk.image span{color:#8e4ec6}.tk.ticket span{color:var(--warn)}
.tk b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis}.tk i{font-style:normal;color:var(--dim);font-size:12px}
.bl{display:flex;flex-direction:column;gap:6px}.bl div{display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;font-size:13px}
.bl i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--a2))}
.heat td{padding:0;border:0}.heat td div{margin:1px;height:20px;border-radius:4px;background:var(--accent)}.heat th{padding:2px 4px;font-size:10px}
.fn{display:flex;flex-direction:column;gap:6px}.fn div{display:grid;grid-template-columns:100px 1fr 90px;gap:8px;align-items:center}.fn i{display:block;height:22px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--a2))}
.meter{height:12px;border-radius:7px;background:var(--p2);overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));background-size:300px 100%}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px;color:var(--text)}.chk input{accent-color:var(--accent)}
.ordrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.msgb{padding:8px 12px;border-radius:12px;margin:6px 0;background:var(--p2);max-width:85%;white-space:pre-wrap}.msgb.a{margin-left:auto;background:rgba(255,90,0,.16)}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}.pg .card{margin:0;white-space:pre-wrap;font-size:13px}
.sp{display:grid;grid-template-columns:300px 1fr;gap:12px}.sp .list{max-height:70vh;overflow:auto}
#drw{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:50;overflow:auto;padding:16px;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
#drw.open{transform:none}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:70;padding:14px;animation:in .2s}
.mod .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s;z-index:90}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){#app{grid-template-columns:1fr}#nav{position:static;height:auto;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}#nav .t{width:auto;white-space:nowrap}.ng,.brand,.role,.foot{display:none}.sp{grid-template-columns:1fr}main{padding:10px}}
</style>
</head>
<body>
<div id="gate">Loading...</div>
<div id="app" hidden>
  <aside id="nav"></aside>
  <main>
    <div class="top">
      <h2 id="ttl"></h2>
      <input type="date" id="dFrom"><input type="date" id="dTo">
      <button class="btn sm" data-q="1">Today</button><button class="btn sm" data-q="7">7d</button><button class="btn sm" data-q="30">30d</button><button class="btn sm" data-q="90">90d</button>
      <label class="chk" style="margin:0"><input type="checkbox" id="cmp" checked> Compare</label>
      <select id="auto"><option value="0">Auto-refresh: off</option><option value="10">10 sec</option><option value="30">30 sec</option><option value="60">60 sec</option></select>
      <select id="pre"><option value="">Saved views</option></select><button class="btn sm" id="preSave">Save view</button><button class="btn sm" id="preDel">Delete view</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="drw"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js"></script>
<script>
const C = window.PERSES_CONFIG, sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const S = { role: '', email: '', tab: 'live', sub: {}, from: '', to: '', compare: true, charts: {}, set: {}, dash: null, dashKey: '', dashT: 0, sel: new Set(), uf: {}, hrs: 24, notes: [], t: 0, ticket: 0 };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtD = d => d ? new Date(d).toLocaleDateString() : '-', fmtT = d => d ? new Date(d).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
const iso = d => d.toISOString().slice(0, 10), num = n => (+n || 0).toLocaleString();
const ago = d => { const s = Math.max(0, (Date.now() - new Date(d)) / 1000); return s < 60 ? Math.floor(s) + 's ago' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago'; };
const EDIT = () => ['owner', 'admin'].includes(S.role), SUP = () => EDIT() || S.role === 'support', OWNER = () => S.role === 'owner';
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2600); };
const el = h => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const nDays = () => Math.round((new Date(S.to) - new Date(S.from)) / 864e5) + 1;
const gridC = () => getComputedStyle(document.documentElement).getPropertyValue('--grid');
const dim = () => getComputedStyle(document.documentElement).getPropertyValue('--dim');

async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args || {}); if (error) { toast(error.message); throw error; } return data; }
async function api(action, body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify({ action, ...(body || {}) }) });
  let d; try { d = JSON.parse((await r.text()).trim()); } catch { throw new Error('Unexpected reply from the server'); }
  if (d.error) { toast(d.error); throw new Error(d.error); } return d;
}
async function dash() { const k = S.from + '|' + S.to; if (S.dash && S.dashKey === k && Date.now() - S.dashT < 20000) return S.dash; S.dash = await rpc('admin_dash', { p_from: S.from, p_to: S.to }); S.dashKey = k; S.dashT = Date.now(); S.notes = S.dash.notes || []; return S.dash; }
async function loadSettings() { const { data } = await sb.from('settings').select('key,value'); S.set = Object.fromEntries((data || []).map(x => [x.key, x.value])); }
async function saveSetting(key, value) { const { error } = await sb.from('settings').upsert({ key, value, updated_by: S.email, updated_at: new Date().toISOString() }); if (error) { toast(error.message); return false; } S.set[key] = value; toast('Saved'); return true; }

/* ---------- charts ---------- */
Chart.register({ id: 'annot', afterDatasetsDraw(ch, a, o) { const list = (o && o.list) || []; const xs = ch.scales.x; if (!list.length || !xs) return; const c = ch.ctx; list.forEach(n => { const i = ch.data.labels.indexOf(String(n.d).slice(5)); if (i < 0) return; const x = xs.getPixelForValue(i); c.save(); c.strokeStyle = '#ff5a00'; c.setLineDash([4, 3]); c.beginPath(); c.moveTo(x, ch.chartArea.top); c.lineTo(x, ch.chartArea.bottom); c.stroke(); c.fillStyle = '#ff5a00'; c.font = '11px sans-serif'; c.fillText(String(n.t).slice(0, 20), Math.min(x + 4, ch.chartArea.right - 70), ch.chartArea.top + 11); c.restore(); }); } });
function chart(id, type, labels, sets, opt) {
  if (S.charts[id]) S.charts[id].destroy(); const cv = document.getElementById(id); if (!cv) return;
  Chart.defaults.color = dim();
  S.charts[id] = new Chart(cv, { type, data: { labels, datasets: sets.filter(Boolean) }, options: Object.assign({ responsive: true, maintainAspectRatio: false, animation: { duration: 350 }, plugins: { legend: { display: sets.filter(Boolean).length > 1 || type === 'doughnut', labels: { boxWidth: 10 } }, annot: { list: S.notes } }, scales: type === 'doughnut' ? {} : { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true, grid: { color: gridC() } } } }, opt || {}) });
}
const PAL = ['#ff5a00', '#ff9a3c', '#d4a73a', '#30a46c', '#0091ff', '#8e4ec6', '#e5484d', '#888'];
const delta = (a, b) => { if (!b) return a ? '<em class="up">new</em>' : ''; const p = Math.round((a - b) / b * 100); return `<em class="${p >= 0 ? 'up' : 'dn'}">${p >= 0 ? '+' : ''}${p}%</em>`; };
const card = (l, v, extra) => `<div class="card"><small>${l}</small><b>${v}</b>${extra || ''}</div>`;
const barList = (arr, key = 'k') => { const mx = Math.max(1, ...arr.map(x => +x.n)); return `<div class="bl">${arr.map(x => `<div><span>${esc(x[key])}</span><i style="width:${Math.max(3, x.n / mx * 100)}%"></i><b>${num(x.n)}</b></div>`).join('') || '<div class="empty">No data yet</div>'}</div>`; };
const tbl = (head, rows) => `<div class="tw"><table><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.join('') || `<tr><td colspan="${head.length}" class="empty">Nothing here yet</td></tr>`}</table></div>`;

/* ---------- small dialogs ---------- */
function form(title, fields, ok) {
  return new Promise(res => {
    const body = fields.map(f => `<label>${esc(f.label)}</label>` + (f.type === 'textarea' ? `<textarea data-k="${f.k}" rows="${f.rows || 5}" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>` : f.type === 'select' ? `<select data-k="${f.k}" style="width:100%">${f.options.map(o => { const a = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(a[0])}" ${String(a[0]) === String(f.value) ? 'selected' : ''}>${esc(a[1])}</option>`; }).join('')}</select>` : `<input style="width:100%" data-k="${f.k}" type="${f.type || 'text'}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}">`)).join('');
    const m = el(`<div class="mod"><div class="sheet"><h3>${esc(title)}</h3>${body}<div class="row end"><button class="btn" data-c>Cancel</button><button class="btn pri" data-o>${esc(ok || 'Save')}</button></div></div></div>`);
    document.body.append(m); const done = v => { m.remove(); res(v); };
    $('[data-c]', m).onclick = () => done(null); m.onclick = e => { if (e.target === m) done(null); };
    $('[data-o]', m).onclick = () => done(Object.fromEntries($$('[data-k]', m).map(i => [i.dataset.k, i.value])));
  });
}
const confirmBox = async (t) => (await form(t, [], 'Yes, do it')) !== null;

/* ---------- tabs ---------- */
function subs(tab, list, draw) {
  const cur = list.some(x => x[0] === S.sub[tab]) ? S.sub[tab] : list[0][0], v = $('#view'); v.innerHTML = `<div class="subs">${list.map(([i, l]) => `<button class="${i === cur ? 'on' : ''}" data-s="${i}">${l}</button>`).join('')}</div><div id="sv"></div>`;
  $$('.subs button', v).forEach(b => b.onclick = () => { S.sub[tab] = b.dataset.s; render(); }); return draw(cur, $('#sv'));
}

/* LIVE */
async function vLive() {
  const d = await rpc('admin_live'), pm = d.per_min || [], tot = pm.reduce((s, x) => s + x.n, 0);
  $('#view').innerHTML = `<div class="cards">${card('Online now', d.online, `<em>${d.online_users} signed in</em>`)}${card('Messages, last hour', tot)}${card('This minute', (pm[pm.length - 1] || {}).n || 0)}</div>
  <div class="grid2"><div class="card"><h3>Messages per minute</h3><div class="cv"><canvas id="c_m"></canvas></div></div><div class="card"><h3>Live activity</h3><div class="ticker">${(d.recent || []).map(e => `<div class="tk ${e.t}"><span>${e.t}</span><b>${esc(e.d)}</b><i>${ago(e.ts)}</i></div>`).join('') || '<div class="empty">Quiet right now</div>'}</div></div></div>`;
  chart('c_m', 'bar', pm.map(x => new Date(x.m).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })), [{ label: 'Messages', data: pm.map(x => x.n), backgroundColor: '#ff5a00' }]);
}

/* OVERVIEW */
async function vOverview() {
  const d = await dash(), n = nDays(), all = d.daily, cur = all.slice(-n), prev = all.slice(0, all.length - n), sum = (a, k) => a.reduce((s, x) => s + (+x[k] || 0), 0), lab = cur.map(x => x.d.slice(5));
  const ds = (k, col, name) => [{ label: name, data: cur.map(x => x[k]), borderColor: col, backgroundColor: col + '33', fill: true, tension: .3 }, S.compare ? { label: 'Previous period', data: prev.map(x => x[k]), borderColor: '#888', borderDash: [5, 4], tension: .3, pointRadius: 0 } : null];
  $('#view').innerHTML = `<div class="cards">${card('Total users', num(d.users_total))}${card('New users', num(sum(cur, 'signups')), S.compare ? delta(sum(cur, 'signups'), sum(prev, 'signups')) : '')}${card('Paid users', num(d.paid))}${card('Active today / week / month', `${num(d.dau)} / ${num(d.wau)} / ${num(d.mau)}`)}${card('Messages', num(sum(cur, 'msgs')), S.compare ? delta(sum(cur, 'msgs'), sum(prev, 'msgs')) : '')}${card('Images', num(sum(cur, 'imgs')), S.compare ? delta(sum(cur, 'imgs'), sum(prev, 'imgs')) : '')}${card('All-engines-busy events', num(d.busy))}</div>
  <div class="grid2"><div class="card"><h3>New sign-ups</h3><div class="cv"><canvas id="o1"></canvas></div></div><div class="card"><h3>Messages</h3><div class="cv"><canvas id="o2"></canvas></div></div><div class="card"><h3>Images</h3><div class="cv"><canvas id="o3"></canvas></div></div><div class="card"><h3>Active users</h3><div class="cv"><canvas id="o4"></canvas></div></div></div>
  <div class="card" style="margin-top:12px"><h3>Chart notes (shown as dashed lines)</h3>${EDIT() ? '<div class="row"><input type="date" id="anD"><input id="anT" placeholder="e.g. Launched voice chat" style="flex:1"><button class="btn pri" id="anA">Add note</button></div>' : ''}<div id="anL">${S.notes.map(n => `<div class="ordrow"><span>${esc(n.d)}: ${esc(n.t)}</span>${EDIT() ? `<button class="btn sm" data-d="${n.d}">Remove</button>` : ''}</div>`).join('') || '<small>No notes yet.</small>'}</div></div>`;
  chart('o1', 'line', lab, ds('signups', '#ff5a00', 'This period')); chart('o2', 'line', lab, ds('msgs', '#ff9a3c', 'This period')); chart('o3', 'line', lab, ds('imgs', '#8e4ec6', 'This period')); chart('o4', 'line', lab, ds('users', '#30a46c', 'This period'));
  if (EDIT()) { $('#anA').onclick = async () => { const day = $('#anD').value, t = $('#anT').value.trim(); if (!day || !t) return toast('Choose a date and write a note.'); const { error } = await sb.from('annotations').upsert({ day, text: t }); if (error) return toast(error.message); S.dash = null; render(); }; $$('#anL [data-d]').forEach(b => b.onclick = async () => { await sb.from('annotations').delete().eq('day', b.dataset.d); S.dash = null; render(); }); }
}

/* GROWTH */
async function vGrowth() {
  const d = await dash(), r = d.ret || {}, pc = (a, b) => b ? Math.round(a / b * 100) + '%' : '-', f = d.funnel || {}, steps = [['Visits', f.visit], ['Guest chat', f.guest], ['Signed up', f.signup], ['Verified', f.verified], ['Onboarded', f.onboarded], ['Came back', r.twice]], mx = Math.max(1, ...steps.map(s => +s[1] || 0)), dn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const hm = {}; let hmax = 1; (d.heat || []).forEach(x => { hm[x.dow + '_' + x.h] = x.n; hmax = Math.max(hmax, x.n); });
  $('#view').innerHTML = `<div class="cards">${card('Daily active', num(d.dau))}${card('Weekly active', num(d.wau))}${card('Monthly active', num(d.mau))}${card('Stickiness (day / month)', d.mau ? Math.round(d.dau / d.mau * 100) + '%' : '-')}</div>

$('#preSave').onclick = async () => { const r = await form('Save this view', [{ k: 'n', label: 'Name (page, dates and compare are saved)' }], 'Save'); if (r && r.n.trim()) { const a = presets(); a.push({ n: r.n.trim(), from: S.from, to: S.to, compare: S.compare, tab: S.tab }); localStorage.setItem('pa_presets', JSON.stringify(a)); drawPre(); toast('View saved'); } };
$('#preDel').onclick = () => { const i = $('#pre').value; if (i === '') return; const a = presets(); a.splice(+i, 1); localStorage.setItem('pa_presets', JSON.stringify(a)); drawPre(); };
$('#pre').onchange = () => { const p = presets()[+$('#pre').value]; if (!p || !allowed(p.tab)) return; S.tab = p.tab; S.compare = p.compare; $('#cmp').checked = p.compare; setRange(p.from, p.to); buildNav(); render(); };

(async function start() {
  document.documentElement.dataset.theme = localStorage.getItem('pa_theme') || 'dark';
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#gate').innerHTML = 'Please log in on the main site first, then open this page again.<br><br><a class="btn pri" href="index.html?auth=login">Go to login</a>'; return; }
  S.email = (session.user.email || '').toLowerCase();
  const { data: role } = await sb.rpc('my_role');
  if (!role) { $('#gate').textContent = 'No access. This page is only for Perses admins.'; return; }
  S.role = role; $('#gate').hidden = true; $('#app').hidden = false;
  const t = new Date(); setRange(iso(new Date(Date.now() - 13 * 864e5)), iso(t)); drawPre(); await loadSettings(); buildNav(); render();
})();
</script>
</body>
</html>
